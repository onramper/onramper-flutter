name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dart:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: git lfs pull
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Pigeon drift check
        run: |
          dart run pigeon --input pigeons/onramper_api.dart
          git diff --exit-code lib/src/platform/pigeon.g.dart ios/Classes/Pigeon.g.swift
