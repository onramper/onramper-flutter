# Publishes to pub.dev via OIDC trusted publishing, then creates the GitHub
# release. Triggered by the `v<version>` tag that `release.yml` pushes.
#
# Not the dart-lang/setup-dart reusable publish workflow: that one installs
# only the Dart SDK, and this package depends on `sdk: flutter`.
#
# One-time setup:
#   pub.dev/packages/onramper_flutter/admin → Automated publishing
#     Repository:            onramper/onramper-flutter
#     Tag pattern:           v{{version}}
#     Require environment:   pub.dev
#   GitHub → Settings → Environments → `pub.dev`
#     Required reviewers:    release approvers (the human gate before going
#                            live; a pub.dev version cannot be deleted)
#     Deployment tags:       v*

name: publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      # Required for pub.dev OIDC token exchange. Do not remove.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Registers the GitHub OIDC token with pub for https://pub.dev. Must run
      # before flutter-action so `flutter pub publish` picks up the token.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: Verify tag matches pubspec
        run: |
          PUBSPEC=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          if [ "v${PUBSPEC}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${PUBSPEC}."; exit 1
          fi

      - run: flutter pub get
      - run: flutter pub publish --force

  # Separate job so only this one gets contents: write, and the job holding
  # the pub.dev OIDC permission runs no step that can write to the repo.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # This version's CHANGELOG section, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (found) exit; if ($0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
