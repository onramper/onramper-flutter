# Auto-publish to pub.dev via OIDC trusted publisher.
#
# Fires automatically on every version tag (`v*.*.*`) pushed by release.yml.
# Uses pub.dev's OIDC "trusted publisher" flow — no long-lived credentials.
#
# Trusted publisher configured at:
#   pub.dev/packages/onramper_flutter/admin → Automated publishing
#   Repository:   onramper/onramper-flutter
#   Tag pattern:  v{{version}}

name: publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      # Required for pub.dev OIDC token exchange. Do not remove.
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
