name: ios-tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pod-lib-lint:
    # macos-26 for Xcode 26 / Swift 6.2, which the v1.1.0 xcframework needs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - run: flutter pub get
      - name: Prepare OnramperSDK
        # Ensure the vendored framework exists before lint checks file patterns.
        # Reuse the podspec's pinned download and checksum instead of duplicating
        # them here. The public release also works without a repository secret.
        env:
          ONRAMPER_IOS_READ_TOKEN: ${{ github.token }}
        run: |
          pod ipc spec ios/onramper_flutter.podspec \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["prepare_command"])' \
            > "$RUNNER_TEMP/prepare-onramper-sdk.sh"
          (cd ios && bash "$RUNNER_TEMP/prepare-onramper-sdk.sh")
          test -d ios/Frameworks/OnramperSDK.xcframework
      - name: pod lib lint
        run: pod lib lint ios/onramper_flutter.podspec --allow-warnings
