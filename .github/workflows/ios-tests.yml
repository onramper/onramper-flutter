name: ios-tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pod-lib-lint:
    # macos-26 for Xcode 26 / Swift 6.2, which the v1.1.0 xcframework needs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - run: flutter pub get
      - name: pod lib lint
        # onramper/onramper-ios is public; the podspec's prepare_command
        # fetches the xcframework anonymously.
        run: pod lib lint ios/onramper_flutter.podspec --allow-warnings
