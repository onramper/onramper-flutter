name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version (e.g. 1.1.0 or 1.1.0+1)'
        required: true

jobs:
  release:
    runs-on: macos-15
    permissions:
      # Push the release commit + tag, and create the GitHub release.
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: Update pubspec version
        run: |
          sed -i '' "s/^version:.*/version: ${VERSION}/" pubspec.yaml

      - name: Update podspec version
        run: |
          sed -i '' "s/s\.version[[:space:]]*=.*'.*'/s.version          = '${VERSION}'/" ios/onramper_sdk.podspec

      - name: flutter pub get
        run: flutter pub get

      # Dry-run publish gates the tag creation on pub.dev acceptance —
      # catches metadata / analysis / dependency issues before we push a
      # permanent tag. The real `dart pub publish` step below is gated on
      # dry-run passing.
      - name: dart pub publish --dry-run
        run: dart pub publish --dry-run

      - name: Configure git
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'

      - name: Commit + tag + push
        run: |
          git commit -am "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin master "v${VERSION}"

      # `dart pub publish` requires pub.dev credentials. In CI this normally
      # comes from `PUB_CREDENTIALS_JSON` (a repo/org secret set to the JSON
      # contents of `~/.config/dart/pub-credentials.json` obtained on a
      # maintainer machine via `dart pub token add https://pub.dev`). If the
      # secret is absent this step is skipped and the release is tag-only —
      # a maintainer can then publish manually with `dart pub publish` from
      # their own machine.
      - name: dart pub publish
        if: ${{ env.PUB_CREDENTIALS_JSON != '' }}
        env:
          PUB_CREDENTIALS_JSON: ${{ secrets.PUB_CREDENTIALS_JSON }}
        run: |
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_CREDENTIALS_JSON" > "$HOME/.config/dart/pub-credentials.json"
          dart pub publish --force

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
