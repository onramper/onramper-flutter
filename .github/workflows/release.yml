name: release

# Manual-dispatch release cutter. Versions are bumped in PRs (pubspec.yaml,
# the podspec, CHANGELOG.md); this workflow only verifies that master is
# ready to ship as the given version, then pushes the `v<version>` tag.
#
# Publication itself happens in `publish.yml`, which the tag push triggers.
# pub.dev's OIDC trusted publishing only accepts runs started by a tag push,
# so publishing cannot live in this workflow_dispatch run.
#
# The tag is pushed with RELEASE_REPO_TOKEN, not GITHUB_TOKEN: GitHub does
# not start workflows from events created by GITHUB_TOKEN, so a tag pushed
# with it would never trigger `publish.yml`. The token needs Contents:
# read & write on onramper/onramper-flutter.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to release (e.g. 1.3.1). Must equal pubspec.yaml and the bundled onramper-ios SDK version.'
        required: true

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: Validate version format
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' must be X.Y.Z."; exit 1
          fi

      - name: Verify versions match
        run: |
          set -euo pipefail
          PUBSPEC=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          PODSPEC=$(sed -n "s/^[[:space:]]*s\.version[[:space:]]*=[[:space:]]*'\(.*\)'.*/\1/p" ios/onramper_flutter.podspec)
          IOS_SDK=$(sed -n 's/^[[:space:]]*ONRAMPER_SDK_VERSION="v\(.*\)".*/\1/p' ios/onramper_flutter.podspec)
          echo "pubspec=$PUBSPEC podspec=$PODSPEC ios-sdk=$IOS_SDK"
          FAIL=0
          [ "$PUBSPEC" = "$VERSION" ] || { echo "::error::pubspec.yaml is $PUBSPEC, not $VERSION."; FAIL=1; }
          [ "$PODSPEC" = "$VERSION" ] || { echo "::error::podspec s.version is $PODSPEC, not $VERSION."; FAIL=1; }
          [ "$IOS_SDK" = "$VERSION" ] || { echo "::error::Bundled onramper-ios SDK is v$IOS_SDK, not v$VERSION."; FAIL=1; }
          grep -qE "^## ${VERSION//./\\.}( |$)" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## $VERSION' section."; FAIL=1; }
          exit $FAIL

      - name: Verify iOS release exists
        run: |
          curl -fsSIL -o /dev/null \
            "https://github.com/onramper/onramper-ios/releases/download/v${VERSION}/OnramperSDK.xcframework.zip" \
            || { echo "::error::No onramper-ios release asset for v${VERSION}."; exit 1; }

      - name: Refuse if already on pub.dev
        run: |
          if curl -fsS https://pub.dev/api/packages/onramper_flutter \
            | jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' >/dev/null; then
            echo "::error::onramper_flutter $VERSION is already on pub.dev."; exit 1
          fi

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      # Gates the tag on pub.dev acceptance (metadata, dependencies, layout).
      - run: flutter pub publish --dry-run

      - name: Push tag
        env:
          TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent: a previous run may already have pushed the tag. If the
          # publish then failed, re-run the `publish` workflow run instead.
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "::notice::Tag v${VERSION} already exists; nothing to push."
            exit 0
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_REPO_TOKEN is not set; a GITHUB_TOKEN push would not trigger publish.yml."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v${VERSION}" -m "onramper_flutter v${VERSION}"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${VERSION}"
          {
            echo "### Tagged v${VERSION}"
            echo
            echo "The \`publish\` workflow will start and wait for approval on the \`pub.dev\` environment."
          } >> "$GITHUB_STEP_SUMMARY"
